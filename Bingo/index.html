<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ELDER ABYSS BINGO</title>
  <link rel="stylesheet" href="style.css" type="text/css">
  <link rel="icon" type="image/x-icon" href="ico.ico">
</head>

<body>
  <main class="bingo-wrapper">
    <h1>ELDER ABYSS BINGO!!</h1>
    <div id="bingo-image">
      <div id="bingo-card" class="grid"></div>
      <div id="line-count">Lines Completed: 0</div>
    </div>
    <button id="generate-btn">Generate New Card</button>
    <button id="use-btn">Use This Card</button>
    <p id="tip">Tip: Click on a cell to mark it!</p>
  </main>
  <div id="color-settings">
    <label>
      Grid Color:
      <input type="color" id="grid-color" value="#e0e7ff">
    </label>
    <label>
      Marked Color:
      <input type="color" id="marked-color" value="#1e3a8a">
    </label>
    <br>
    <label>
      Line Color:
      <input type="color" id="line-mark-color" value="#fef3c7">
    </label>
    <label>
      Outline Color:
      <input type="color" id="line-color" value="#f59e0b">
    </label>
  </div>
  <div>
    <button id="reset-btn">Start Over</button>
    <button id="save-btn">Save Card as Image</button>
  </div>
  <button id="theme-toggle" aria-label="Toggle theme">
    <span id="theme-icon">🌙</span>
  </button>
  <script src="script.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body>

</html>
